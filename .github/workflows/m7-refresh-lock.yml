name: M7 Refresh Lock

on:
  push:
    branches: [feat/m7-antigravity-linux-parity]

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/m7-antigravity-linux-parity
      - uses: dtolnay/rust-toolchain@stable
      - name: Resolve lockfile
        run: cargo metadata --format-version 1 > /dev/null
      - name: Commit lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(deps): refresh Cargo.lock for Linux keyring"
          git push origin HEAD:feat/m7-antigravity-linux-parity

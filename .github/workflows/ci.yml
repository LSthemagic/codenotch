name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: Windows Rust workspace
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cargo check --workspace
      - name: Cargo test
        run: cargo test --workspace

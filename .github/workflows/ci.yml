name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: Windows Rust workspace
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cargo check --workspace
      - name: Cargo test
        run: cargo test --workspace

  linux:
    name: Linux Rust workspace
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils
      - name: Prepare Linux sidecar
        run: bash scripts/prepare-linux-sidecar.sh debug
      - name: Cargo check
        run: cargo check --workspace
      - name: Verify Cargo.lock is up to date
        run: git diff --exit-code -- Cargo.lock
      - name: Cargo test
        run: cargo test --workspace
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Prepare release sidecar
        run: bash scripts/prepare-linux-sidecar.sh release
      - name: Build Linux bundles
        working-directory: nyrva
        run: |
          set +e
          cargo tauri build > /tmp/tauri-build.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::error::cargo tauri build failed with exit code $status"
            echo "::group::Relevant Tauri build errors"
            grep -Ei 'error|failed|externalbin|sidecar|appimage|bundle' /tmp/tauri-build.log | tail -n 80 || true
            echo "::endgroup::"
            echo "::group::Last 120 lines of Tauri build"
            tail -n 120 /tmp/tauri-build.log
            echo "::endgroup::"
            exit "$status"
          fi
          tail -n 40 /tmp/tauri-build.log
      - name: Inspect Linux bundle contents
        run: |
          set -euo pipefail
          deb="$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          appimage="$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$deb"
          test -n "$appimage"

          mkdir -p target/bundle-diagnostics
          printf '%s\n' "$deb" > target/bundle-diagnostics/deb-path.txt
          printf '%s\n' "$appimage" > target/bundle-diagnostics/appimage-path.txt
          dpkg-deb -c "$deb" > target/bundle-diagnostics/deb-manifest.txt

          appimage="$(realpath "$appimage")"
          chmod +x "$appimage"
          extract_dir="$(mktemp -d)"
          (
            cd "$extract_dir"
            "$appimage" --appimage-extract >/dev/null
          )
          find "$extract_dir/squashfs-root" -maxdepth 8 \( -type f -o -type l \) -printf '%M %p\n' \
            > target/bundle-diagnostics/appimage-manifest.txt

          echo "::group::deb sidecar candidates"
          grep -Ei 'nyrva|hook|usr/bin' target/bundle-diagnostics/deb-manifest.txt || true
          echo "::endgroup::"
          echo "::group::AppImage sidecar candidates"
          grep -Ei 'nyrva|hook|usr/bin' target/bundle-diagnostics/appimage-manifest.txt || true
          echo "::endgroup::"
      - name: Upload Linux bundle diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundle-diagnostics
          path: target/bundle-diagnostics/*.txt
      - name: Verify Linux bundles and hook sidecar
        run: |
          set -euo pipefail
          grep -Eq '\./usr/bin/nyrva-hook$' target/bundle-diagnostics/deb-manifest.txt
          grep -Eq '/usr/bin/nyrva-hook$' target/bundle-diagnostics/appimage-manifest.txt

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: Windows Rust workspace
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cargo check --workspace
      - name: Cargo test
        run: cargo test --workspace

  linux:
    name: Linux Rust workspace
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils
      - name: Cargo check
        run: cargo check --workspace
      - name: Verify Cargo.lock is up to date
        run: git diff --exit-code -- Cargo.lock
      - name: Cargo test
        run: cargo test --workspace
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Build Linux bundles
        working-directory: nyrva
        run: cargo tauri build
      - name: Verify Linux bundles
        run: |
          test -n "$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"

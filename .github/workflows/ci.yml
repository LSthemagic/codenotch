name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: Windows Rust workspace
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo check
        run: cargo check --workspace
      - name: Cargo test
        run: cargo test --workspace

  linux:
    name: Linux Rust workspace
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            xdg-utils
      - name: Cargo check
        run: cargo check --workspace
      - name: Refresh Cargo.lock on feature branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if ! git diff --quiet -- Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Cargo.lock
            git commit -m "chore: refresh Cargo.lock for Linux dependencies"
            git push origin HEAD:${{ github.head_ref }}
            exit 1
          fi
      - name: Verify Cargo.lock is up to date
        run: git diff --exit-code -- Cargo.lock
      - name: Cargo test
        run: cargo test --workspace
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked
      - name: Build Linux bundles
        working-directory: nyrva
        run: cargo tauri build
      - name: Verify Linux bundles
        run: |
          test -n "$(find target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$(find target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
